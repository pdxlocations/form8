; Shared by the default pioarduino project and the nRF-only command-line wrapper.
[nrf52]
platform = nordicnrf52@10.11.0
board = adafruit_feather_nrf52840
framework = arduino
platform_packages = framework-arduinoadafruitnrf52@1.10700.0
board_build.variant = variant
board_build.variants_dir = firmware/nrf52
board_build.ldscript = firmware/nrf52/app.ld
board_build.softdevice.sd_version = 7.3.0
board_build.softdevice.sd_fwid = 0x0123
board_build.usb_product = Form8 radio
board_upload.maximum_size = 811008
board_upload.maximum_ram_size = 229376
extra_scripts = pre:tools/nrf_build.py
build_src_filter = +<main.cpp>
build_flags = -std=gnu++17 -DNRF52840_XXAA -DCFG_DEBUG=0 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
  jgromes/RadioLib@7.1.2
  bblanchon/ArduinoJson@7.4.2
  mikalhart/TinyGPSPlus@1.1.0
monitor_speed = 115200

[env:rak4631]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_RAK4631
; RAK stock UF2 bootloaders use S140 6.1.1 and application address 0x26000.
[env:rak4631-s140-6-1-1]
extends = env:rak4631
board_build.softdevice.sd_version = 6.1.1
board_build.softdevice.sd_fwid = 0x00B6
board_build.ldscript = firmware/nrf52/app-s140-6.ld
board_upload.maximum_size = 815104

[env:wismesh-tag]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_WISMESH_TAG
[env:t-echo]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_T_ECHO
[env:heltec-t114]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_T114
[env:heltec-t096]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_T096
[env:seeed-wio-tracker-l1]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_WIO_L1
[env:seeed-xiao-nrf52-kit]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_XIAO_KIT
[env:seeed-t1000-e]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_T1000E

[env:seeed-solar-node]
extends = nrf52
build_flags = ${nrf52.build_flags} -DFORM8_NRF_SOLAR
