[platformio]
src_dir = firmware/nrf52
include_dir = firmware/nrf52
lib_dir = lib
default_envs = rak4631

[env]
platform = nordicnrf52@10.11.0
board = adafruit_feather_nrf52840
framework = arduino
platform_packages = framework-arduinoadafruitnrf52@1.10700.0
board_build.variant = variant
board_build.variants_dir = firmware/nrf52
board_build.ldscript = firmware/nrf52/app.ld
board_build.softdevice.sd_version = 7.3.0
board_build.softdevice.sd_fwid = 0x0123
board_build.usb_product = Form8 radio
board_upload.maximum_size = 811008
board_upload.maximum_ram_size = 229376
extra_scripts = pre:tools/nrf_build.py
build_src_filter = +<main.cpp>
build_flags = -std=gnu++17 -DNRF52840_XXAA -DCFG_DEBUG=0 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
  jgromes/RadioLib@7.1.2
  bblanchon/ArduinoJson@7.4.2
  mikalhart/TinyGPSPlus@1.1.0
monitor_speed = 115200

[env:rak4631]
build_flags = ${env.build_flags} -DFORM8_NRF_RAK4631
[env:wismesh-tag]
build_flags = ${env.build_flags} -DFORM8_NRF_WISMESH_TAG
[env:t-echo]
build_flags = ${env.build_flags} -DFORM8_NRF_T_ECHO
[env:heltec-t114]
build_flags = ${env.build_flags} -DFORM8_NRF_T114
[env:heltec-t096]
build_flags = ${env.build_flags} -DFORM8_NRF_T096
[env:seeed-wio-tracker-l1]
build_flags = ${env.build_flags} -DFORM8_NRF_WIO_L1
[env:seeed-xiao-nrf52-kit]
build_flags = ${env.build_flags} -DFORM8_NRF_XIAO_KIT
[env:seeed-t1000-e]
build_flags = ${env.build_flags} -DFORM8_NRF_T1000E

[env:seeed-solar-node]
build_flags = ${env.build_flags} -DFORM8_NRF_SOLAR
