name: Release firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number only, for example 0.2.0 (commit hash and Beta are added automatically)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-firmware-${{ github.event.release.id || format('{0}-{1}', github.sha, inputs.version) }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Build and attach all firmware targets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact release or selected workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Determine release name and tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$VERSION_INPUT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo 'Enter a version such as 0.2.0, without v, a commit hash, or beta.' >&2
              exit 1
            fi
            short_commit=${commit:0:7}
            tag="v${VERSION_INPUT}.${short_commit}-beta"
            title="Form8 Firmware ${VERSION_INPUT}.${short_commit} Beta"
            echo "title=$title" >> "$GITHUB_OUTPUT"
          else
            tag="$PUBLISHED_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python3 -m pip install platformio==6.1.19

      - name: Check every visible environment against both firmware catalogs
        run: |
          python3 tools/check_firmware_targets.py
          python3 tools/test_nrf_images.py

      - name: Build and package every target
        run: python3 tools/build_firmware.py --webflasher

      - name: Build and package all nRF52840 targets
        run: python3 tools/build_nrf52.py

      - name: Verify nRF checksums
        working-directory: dist/nrf52
        run: sha256sum --check SHA256SUMS-NRF52

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install companion dependencies and test
        run: |
          npm ci
          npm test
          npm run test:mesh
          npm run test:api
          npm run test:ble

      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Build and lint the Android development APK
        run: python3 tools/build_android.py

      - name: Verify standalone Android APK checksum
        working-directory: dist
        run: sha256sum --check form8-android-debug.apk.sha256

      - name: Verify binary checksums
        working-directory: dist/firmware
        run: sha256sum --check SHA256SUMS

      - name: Set up PHP ZIP support for web flasher tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, zip
          coverage: none

      - name: Package downloads into platform folders
        run: |
          python3 tools/test_release_package.py
          php tests/webflasher-api.php
          npm run webflasher:prepare
          python3 tools/package_release.py

      - name: Save organized build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: form8-release
          path: dist/release/
          if-no-files-found: error

      - name: Save standalone Android build artifact
        uses: actions/upload-artifact@v7
        with:
          name: form8-android
          path: |
            dist/form8-android-debug.apk
            dist/form8-android-debug.apk.sha256
          if-no-files-found: error

      - name: Create or resume a draft beta release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          # Never reuse a tag pointing to different code. These generated tags
          # are lightweight tags; annotated or mismatched tags require a new version.
          if existing_commit=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null); then
            if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
              echo 'The generated tag already points to different code. Choose a new version.' >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT"
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo 'This beta is already published. Choose a new version or commit.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TITLE" \
              --verify-tag --prerelease --draft --generate-notes
          fi
          # Recheck after creation before uploading binaries or publishing.
          actual_commit=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$actual_commit" = "$RELEASE_COMMIT"

      - name: Attach firmware to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/form8-release.zip \
            dist/form8-release.zip.sha256 \
            dist/form8-android-debug.apk \
            dist/form8-android-debug.apk.sha256 \
            --clobber

      - name: Publish the completed beta release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --draft=false --prerelease --latest=false
