[platformio]
default_envs = heltec-v3
data_dir = web

[env]
platform = espressif32@6.13.0
framework = arduino
extra_scripts =
  pre:tools/embed_web.py
  post:tools/export_flash_layout.py
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  jgromes/RadioLib@7.1.2
  bblanchon/ArduinoJson@7.4.2
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:heltec-v3]
board = heltec_wifi_lora_32_V3
lib_deps =
  ${env.lib_deps}
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
board_build.partitions = partitions/heltec.csv
build_flags = ${env.build_flags} -DFORM8_HELTEC_V3

; Experimental VHF target; GPS/PMU support still needs physical verification.
[env:tbeam-bpf]
lib_deps =
  ${env.lib_deps}
  mikalhart/TinyGPSPlus@1.1.0
  lewisxhe/XPowersLib@0.3.3
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/bpf.csv
build_flags = ${env.build_flags} -DFORM8_TBEAM_BPF -DBOARD_HAS_PSRAM


; Heltec V4 OLED, 16 MB flash. PSRAM is not needed by Form8.
; Select the environment matching the FEM chip / PCB revision.
[env:heltec-v4]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions/bpf.csv
lib_deps = ${env:heltec-v3.lib_deps}
build_flags = ${env.build_flags} -DFORM8_HELTEC_V4 -DARDUINO_USB_CDC_ON_BOOT=1

[env:heltec-v4-3]
extends = env:heltec-v4
build_flags = ${env:heltec-v4.build_flags} -DFORM8_HELTEC_V4_KCT8103L

; Requires the ESP32S3-specific Wio-SX1262 B2B radio module.
; No display is assumed; Wi-Fi credentials are printed over USB.
[env:seeed-xiao-s3]
board = seeed_xiao_esp32s3
board_build.partitions = partitions/heltec.csv
build_flags = ${env.build_flags} -DFORM8_XIAO_S3

; 4 MB T3-S3 with 868/915 MHz SX1262. Other radio chips need their own target.
[env:tlora-t3-s3]
board = lilygo-t3-s3
board_build.partitions = partitions/t3-s3.csv
lib_deps = ${env:heltec-v3.lib_deps}
build_flags = ${env.build_flags} -DFORM8_TLORA_T3_S3

[env:tlora-t3-s3-sx1276]
extends = env:tlora-t3-s3
build_flags = ${env:tlora-t3-s3.build_flags} -DFORM8_RADIO_SX1276

; Original ESP32 T-Beam V1.0/V1.1 (AXP192) and V1.2 (AXP2101).
; Select the radio chip; OLED is optional on GPIO21/22. Not T-Beam V0.7 or Supreme.
[env:tbeam]
board = ttgo-t-beam
board_build.partitions = partitions/t3-s3.csv
lib_deps =
  ${env:heltec-v3.lib_deps}
  mikalhart/TinyGPSPlus@1.1.0
  lewisxhe/XPowersLib@0.3.3
build_flags = ${env.build_flags} -DFORM8_TBEAM -DFORM8_RADIO_SX1276

[env:tbeam-sx1262]
extends = env:tbeam
build_flags = ${env.build_flags} -DFORM8_TBEAM

; First-generation TTGO LoRa32: OLED GPIO4/15, reset16; radio reset14.
[env:tlora-v1]
board = ttgo-lora32-v1
board_build.partitions = partitions/t3-s3.csv
lib_deps = ${env:heltec-v3.lib_deps}
build_flags = ${env.build_flags} -DFORM8_TLORA -DFORM8_TLORA_V1 -DFORM8_RADIO_SX1276

; T3 V1.3: OLED GPIO21/22; radio reset14.
[env:tlora-v1-3]
board = ttgo-lora32-v2
board_build.partitions = partitions/t3-s3.csv
lib_deps = ${env:heltec-v3.lib_deps}
build_flags = ${env.build_flags} -DFORM8_TLORA -DFORM8_TLORA_V1_3 -DFORM8_RADIO_SX1276

; LoRa32 V2.1/T3 V1.6.x: OLED GPIO21/22; radio reset23. Crystal SX1276 only.
[env:tlora-v2-1]
board = ttgo-lora32-v21
board_build.partitions = partitions/t3-s3.csv
lib_deps = ${env:heltec-v3.lib_deps}
build_flags = ${env.build_flags} -DFORM8_TLORA -DFORM8_RADIO_SX1276
