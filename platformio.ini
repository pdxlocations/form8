[platformio]
default_envs = heltec-v3
data_dir = web

[env]
platform = espressif32@6.13.0
framework = arduino
extra_scripts = pre:tools/embed_web.py
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  jgromes/RadioLib@7.1.2
  bblanchon/ArduinoJson@7.4.2
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:heltec-v3]
board = heltec_wifi_lora_32_V3
lib_deps =
  ${env.lib_deps}
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
board_build.partitions = partitions/heltec.csv
build_flags = ${env.build_flags} -DFORM8_HELTEC_V3

; Later target. Pin map recorded, but PMU/GPS support and RF testing remain.
[env:tbeam-bpf]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/bpf.csv
build_flags = ${env.build_flags} -DFORM8_TBEAM_BPF -DBOARD_HAS_PSRAM

